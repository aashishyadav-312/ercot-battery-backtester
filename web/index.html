    <script>
      // Apply the saved colour scheme (else the system preference) before first paint to avoid a flash.
      // Keep in step with src/shell/scheme.ts.
      (function () {
        var s = null;
        try { s = localStorage.getItem('ebb-scheme'); } catch (e) {}
        if (s !== 'dark' && s !== 'light') {
          try { s = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'; } catch (e) { s = 'dark'; }
        }
        document.documentElement.setAttribute('data-theme', s);
        document.documentElement.setAttribute('data-mantine-color-scheme', s);
      })();
    </script>
    <script>
      // GoatCounter: privacy-friendly page counts (no cookies, no personal data). Skipped on localhost so dev and
      // screenshot runs are not counted. Page views are sent per route from src/App.tsx, since routing is hash-based.
      (function () {
        var h = location.hostname;
        if (h === 'localhost' || h === '127.0.0.1' || h === '[::1]') return;
        window.goatcounter = { no_onload: true };
        var s = document.createElement('script');
        s.async = true;
        s.src = 'https://gc.zgo.at/count.js';
        s.setAttribute('data-goatcounter', 'https://x0aashish.goatcounter.com/count');
        s.setAttribute('data-goatcounter-settings', JSON.stringify({ no_onload: true }));
        document.head.appendChild(s);
      })();
    </script>
